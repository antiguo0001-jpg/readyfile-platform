<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReadyFile Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><body><main style="max-width:420px;margin:12vh auto;font:16px system-ui;padding:24px"><h1>ReadyFile Admin</h1><p>Platform owner sign in</p><button id="setup">First-time administrator setup</button><form id="f"><p><label>Email <input name="email" type="email" required></label></p><p><label>Password <input name="password" type="password" required minlength="8"></label></p><p id="extra" hidden><label>Full name <input name="full_name"></label></p><p id="codebox" hidden><label>One-time passcode <input name="code"></label></p><button id="submit">Sign in</button></form><p id="msg"></p></main><script>const sb=supabase.createClient('https://cuoeokgkfltwjmmpwzdf.supabase.co','sb_publishable_UybnCVXk0kuI9qyq9K1rAg__ip5G7g9');let first=false;const f=document.querySelector('#f');document.querySelector('#setup').onclick=()=>{first=true;document.querySelector('#extra').hidden=false;document.querySelector('#codebox').hidden=false;document.querySelector('#submit').textContent='Create admin account'};f.onsubmit=async e=>{e.preventDefault();const d=new FormData(f),email=String(d.get('email')).trim().toLowerCase(),password=String(d.get('password'));try{if(first){if(email!=='antiguo0001@gmail.com')throw Error('Use the designated owner email.');let x=await sb.auth.signUp({email,password,options:{data:{full_name:String(d.get('full_name')||'')}}});if(x.error)throw x.error;if(!x.data.session)throw Error('Confirm your email, then sign in and complete setup.');let y=await sb.rpc('redeem_platform_admin_setup',{p_code:String(d.get('code'))});if(y.error)throw y.error}else{let x=await sb.auth.signInWithPassword({email,password});if(x.error)throw x.error}const u=await sb.auth.getUser();const p=await sb.from('profiles').select('is_platform_admin').eq('id',u.data.user.id).single();if(p.error)throw p.error;if(!p.data.is_platform_admin)throw Error('Not an authorized platform administrator.');location.href='/admin.html?ready=1';}catch(x){document.querySelector('#msg').textContent=x.message}};</script></body></html>
