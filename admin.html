<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReadyFile Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#17243b;font:14px system-ui}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:10px 14px;background:#17243b;color:white;font-weight:650}.auth{max-width:430px;margin:8vh auto;background:white;padding:28px;border:1px solid #e3e9ef;border-radius:16px}.field{margin:14px 0}.field label{display:block;font-weight:650;font-size:12px;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #dce3ea;border-radius:8px}.muted{color:#718096}.hidden{display:none!important}.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#17243b;color:white;padding:22px}.side h2{margin-top:0}.side button{display:block;width:100%;text-align:left;background:transparent;color:#dce6f1;margin:5px 0}.main{padding:26px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:16px 0}.card{background:white;border:1px solid #e2e8ef;border-radius:12px;padding:18px;margin-bottom:16px}.value{font-size:27px;font-weight:800;margin-top:7px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid #edf0f4}th{font-size:11px;color:#718096;text-transform:uppercase}.pill{padding:4px 8px;border-radius:20px;background:#e6f5ed;color:#23784d;font-size:11px}.danger{background:#a83c35}.search{padding:10px;border:1px solid #dce3ea;border-radius:8px;width:min(350px,100%)}#msg{color:#a83c35;white-space:pre-wrap}@media(max-width:750px){.shell{grid-template-columns:1fr}.side{padding:12px}.side button{display:inline-block;width:auto}.stats{grid-template-columns:repeat(2,1fr)}.main{padding:14px}}
</style></head><body>
<section id="auth" class="auth"><h1>ReadyFile Admin</h1><p class="muted">Secure platform owner access</p><div style="display:flex;gap:8px;margin:18px 0"><button type="button" id="loginTab">Sign in</button><button type="button" id="setupTab" style="background:#168b83">First-time setup</button></div>
<form id="f"><div id="nameField" class="field"><label>Full name</label><input name="full_name" autocomplete="name"></div><div class="field"><label>Administrator email</label><input name="email" type="email" required autocomplete="username"></div><div class="field"><label>Password (minimum 8 characters)</label><input name="password" type="password" required minlength="8" autocomplete="current-password"></div><div id="codeField" class="field"><label>One-time setup passcode</label><input name="code" autocomplete="one-time-code"></div><button id="submit" style="width:100%">Create administrator account</button></form><p class="muted">Only the designated owner email can redeem the one-time code. Customer logins are not allowed.</p><p id="msg"></p></section>
<div id="app" class="shell hidden"><aside class="side"><h2>ReadyFile</h2><p style="color:#9eafc6">ADMINISTRATION</p><button data-page="overview">Overview</button><button data-page="daycares">Daycares</button><button data-page="billing">Billing</button><button data-page="activity">Activity</button></aside><main class="main"><header class="top"><div><b id="heading">Platform overview</b><div class="muted" id="who"></div></div><button id="logout">Sign out</button></header><div id="view"></div></main></div>
<script>
const sb=supabase.createClient('https://cuoeokgkfltwjmmpwzdf.supabase.co','sb_publishable_UybnCVXk0kuI9qyq9K1rAg__ip5G7g9');let setup=true,businesses=[],logs=[],page='overview';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mode(v){setup=v;$('nameField').classList.toggle('hidden',!v);$('codeField').classList.toggle('hidden',!v);$('submit').textContent=v?'Create administrator account':'Sign in';$('msg').textContent=''}
$('loginTab').onclick=()=>mode(false);$('setupTab').onclick=()=>mode(true);
async function verify(){const {data:{user},error}=await sb.auth.getUser();if(error||!user)throw Error('Please sign in.');const p=await sb.from('profiles').select('is_platform_admin,full_name').eq('id',user.id).single();if(p.error)throw p.error;if(!p.data.is_platform_admin)throw Error('This account is not authorized as a platform administrator.');$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=user.email;await refresh();render()}
$('f').onsubmit=async e=>{e.preventDefault();$('submit').disabled=true;$('msg').textContent='';const d=new FormData(e.target),email=String(d.get('email')).trim().toLowerCase(),password=String(d.get('password'));try{if(setup){if(email!=='purbaranveersingh@gmail.com')throw Error('Use the designated platform-owner email.');let x=await sb.auth.signInWithPassword({email,password});if(x.error)throw x.error;if(!x.data.session)throw Error('Sign-in did not create a session.');const r=await sb.rpc('redeem_platform_admin_setup',{p_code:String(d.get('code')||'').trim()});if(r.error)throw r.error}else{const x=await sb.auth.signInWithPassword({email,password});if(x.error)throw x.error}await verify()}catch(x){$('msg').textContent=x.message||'Unable to continue.'}finally{$('submit').disabled=false}};
async function refresh(){const [b,a]=await Promise.all([sb.from('businesses').select('id,name,email,phone,status,created_at,subscriptions(plan,billing_interval,status,current_period_end,stripe_customer_id)').order('created_at',{ascending:false}),sb.from('audit_logs').select('id,business_id,action,target_type,details,created_at').order('created_at',{ascending:false}).limit(100)]);if(b.error)throw b.error;if(a.error)throw a.error;businesses=b.data||[];logs=a.data||[]}
function stat(label,n){return '<div class="card"><div class="muted">'+label+'</div><div class="value">'+n+'</div></div>'}
function table(rows){return '<div class="tablewrap"><table><thead><tr><th>Daycare</th><th>Contact</th><th>Created</th><th>Status</th><th>Subscription</th><th>Access</th></tr></thead><tbody>'+rows.map(b=>{let s=b.subscriptions?.[0]||{};return '<tr><td><b>'+esc(b.name)+'</b></td><td>'+esc(b.email||'—')+'</td><td>'+new Date(b.created_at).toLocaleDateString()+'</td><td><span class="pill">'+esc(b.status)+'</span></td><td>'+esc(s.plan||'—')+' / '+esc(s.status||'—')+' / '+esc(s.billing_interval||'—')+'</td><td><button class="'+(b.status==='suspended'?'':'danger')+'" onclick="toggleAccess(\''+b.id+'\',\''+b.status+'\')">'+(b.status==='suspended'?'Reactivate':'Suspend')+'</button></td></tr>'}).join('')+'</tbody></table></div>'}
function render(){const active=businesses.filter(b=>b.status==='active').length,trials=businesses.filter(b=>b.subscriptions?.some(s=>s.status==='trialing')).length,paid=businesses.filter(b=>b.subscriptions?.some(s=>s.status==='active')).length,suspended=businesses.filter(b=>b.status==='suspended').length;$('heading').textContent='Platform / '+page[0].toUpperCase()+page.slice(1);if(page==='overview')$('view').innerHTML='<div class="stats">'+stat('Total daycares',businesses.length)+stat('Active accounts',active)+stat('Trial accounts',trials)+stat('Suspended',suspended)+'</div><div class="card"><h3>Recently registered daycares</h3>'+table(businesses.slice(0,8))+'</div>';if(page==='daycares')$('view').innerHTML='<div class="card"><h2>Daycare businesses</h2><input class="search" id="q" placeholder="Search by daycare or email" oninput="filterRows()"><div id="rows">'+table(businesses)+'</div></div>';if(page==='billing')$('view').innerHTML='<div class="stats">'+stat('Active subscriptions',paid)+stat('Trials',trials)+stat('Canceled',businesses.filter(b=>b.subscriptions?.some(s=>s.status==='canceled')).length)+stat('Annual plans',businesses.filter(b=>b.subscriptions?.some(s=>s.billing_interval==='year')).length)+'</div><div class="card"><h3>Billing records</h3>'+table(businesses)+'</div><p class="muted">Subscription rows are database records; live Stripe payment reconciliation is not yet configured.</p>';if(page==='activity')$('view').innerHTML='<div class="card"><h3>Recent activity</h3><div class="tablewrap"><table><thead><tr><th>Time</th><th>Business</th><th>Action</th><th>Details</th></tr></thead><tbody>'+logs.map(l=>'<tr><td>'+new Date(l.created_at).toLocaleString()+'</td><td>'+esc(businesses.find(b=>b.id===l.business_id)?.name||'Platform')+'</td><td>'+esc(l.action)+'</td><td>'+esc(JSON.stringify(l.details||{}))+'</td></tr>').join('')+'</tbody></table></div></div>'}
function filterRows(){const q=$('q').value.toLowerCase();$('rows').innerHTML=table(businesses.filter(b=>(b.name||'').toLowerCase().includes(q)||(b.email||'').toLowerCase().includes(q)))}
async function toggleAccess(id,status){const next=status==='suspended'?'active':'suspended';if(!confirm((next==='active'?'Reactivate':'Suspend')+' this daycare?'))return;const {error}=await sb.from('businesses').update({status:next,suspended_at:next==='suspended'?new Date().toISOString():null,suspension_reason:next==='suspended'?'Suspended by platform administrator':null}).eq('id',id);if(error){alert(error.message);return}await refresh();render()}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=async()=>{page=b.dataset.page;try{await refresh();render()}catch(e){alert(e.message)}});
$('logout').onclick=async()=>{await sb.auth.signOut();$('app').classList.add('hidden');$('auth').classList.remove('hidden');mode(false)};
(async()=>{const {data:{session}}=await sb.auth.getSession();if(session){try{await verify()}catch(e){$('msg').textContent=e.message;await sb.auth.signOut()}}})();
</script></body></html>
